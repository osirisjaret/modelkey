name: Sync APK release info

# 只在 apk/*.apk 变更时触发；本工作流自己改的是 release.json 与旧包删除，
# 配合下面的 github.actor 守卫，避免自触发死循环。
on:
  push:
    paths:
      - "apk/*.apk"

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 以本次推送的 apk 为准，清理旧包并生成 release.json
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, datetime

          D = "apk"
          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "")

          def git(*args):
              try:
                  return subprocess.check_output(["git", *args], stderr=subprocess.DEVNULL).decode().strip()
              except subprocess.CalledProcessError:
                  return ""

          # 1) 从本次 push 的变更列表里找出新增/修改/重命名的 apk
          pushed = []
          if before and after and set(before) != {"0"}:
              for line in git("diff", "--name-status", before, after, "--", D).splitlines():
                  parts = line.split("\t")
                  if len(parts) < 2:
                      continue
                  status, path = parts[0][0], parts[-1]
                  if path.lower().endswith(".apk") and status in ("A", "M", "R", "C"):
                      pushed.append(os.path.basename(path))

          files = sorted(f for f in os.listdir(D) if f.lower().endswith(".apk"))
          if not files:
              print("apk 目录下已没有 .apk，跳过（不写 release.json）")
              raise SystemExit(0)

          def ver(name):
              m = re.search(r"[vV]?(\d+(?:\.\d+)+)", name)
              return m.group(1) if m else None

          def rank(name):
              v = ver(name)
              return (1, tuple(int(x) for x in v.split(".")), name) if v else (0, (), name)

          # 2) 以本次推送带进来的包为准（多个取版本最高）；只有删除时回退到剩余文件
          candidates = [f for f in pushed if f in files]
          if candidates:
              mode = "本次推送"
              pool = candidates
          else:
              mode = "本次无新增（按剩余文件重新生成）"
              pool = files
          keep = max(pool, key=rank)
          print(f"判定依据：{mode}；候选={pool}；保留={keep}")

          for f in files:
              if f != keep:
                  os.remove(os.path.join(D, f))
                  print("删除旧包:", f)

          p = os.path.join(D, keep)
          raw = open(p, "rb").read()
          data = {
              "latest": {
                  "version": ver(keep) or "最新版",
                  "file": keep,
                  "fileName": keep,
                  "sizeBytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "platform": "Android 8.1+ / WearOS",
                  "updatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }
          }
          with open(os.path.join(D, "release.json"), "w", encoding="utf-8") as fh:
              fh.write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apk
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(apk): 以本次推送的 apk 为准更新 release.json"
            git push
          fi
